<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无名者档案 - 卡牌推理游戏（去星标记版）</title>
    <style>
        :root {
            --bg:#1a1410; --panel-bg:#2a2018; --card-bg:#3a2e22; --border:#5a4a3a;
            --text:#e8dcc0; --text-dim:#a89880; --gold:#c8a870; --gold-dark:#8a7040;
            --order-color:#4a80c0; --economy-color:#c8a040; --doubt-color:#a060a0; --innov-color:#50a070;
            --truth-color:#c89030; --hidden-color:#9060c0; --keyq-color:#4070b0; --clue-color:#50a060; --ending-color:#c05050;
            --danger:#c04040; --success:#6ac07a; --coin-color:#d4af37; --debug-bg:#3a2a20; --debug-border:#8a6050;
            --card-width:150px;
            --card-height:210px;
        }
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
        body { background:var(--bg); color:var(--text); font-family:'Georgia','SimSun','Noto Serif SC',serif; min-height:100vh; display:flex; justify-content:center; padding:12px 8px; overflow-x:hidden; }
        #game-container { width:100%; max-width:1200px; display:flex; flex-direction:column; gap:10px; }
        #header { display:flex; justify-content:space-between; align-items:center; background:var(--panel-bg); border:2px solid var(--border); border-radius:8px; padding:10px 16px; flex-wrap:wrap; gap:8px; }
        #title { font-size:1.5em; font-weight:bold; color:var(--gold); letter-spacing:2px; }
        #game-status { font-size:0.85em; color:var(--text-dim); font-style:italic; }
        #gold-display { display:flex; align-items:center; gap:4px; font-size:1.2em; font-weight:bold; color:var(--coin-color); }
        .coin-icon { width:20px;height:20px;background:radial-gradient(circle,#ffe066,#b8860b);border-radius:50%;box-shadow:0 0 6px rgba(255,215,0,0.7);display:inline-block; }
        #debug-panel { display:flex;align-items:center;gap:8px;background:var(--debug-bg);border:2px solid var(--debug-border);border-radius:8px;padding:6px 12px;flex-wrap:wrap;font-size:0.85em; }
        #debug-panel label { color:var(--text-dim);font-weight:bold; }
        #debug-gold-input { width:70px;padding:4px 6px;background:#1a1410;border:1px solid var(--debug-border);border-radius:4px;color:var(--coin-color);font-weight:bold;text-align:center; }
        #debug-gold-btn { background:transparent;border:1px solid var(--coin-color);color:var(--coin-color);padding:4px 10px;border-radius:4px;cursor:pointer;font-weight:bold; }
        #debug-gold-btn:hover { background:rgba(212,175,55,0.2); }
        #score-bar { display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap; }
        .score-item { flex:1;min-width:110px;background:var(--panel-bg);border:2px solid var(--border);border-radius:8px;padding:8px 12px;text-align:center; }
        .score-item.low { border-color:var(--danger); }
        .score-item .score-name { font-size:0.85em;font-weight:bold;letter-spacing:1px;margin-bottom:2px; }
        .score-item .score-value { font-size:1.7em;font-weight:bold; }
        .score-item.order .score-name{color:var(--order-color)} .score-item.order .score-value{color:var(--order-color)}
        .score-item.economy .score-name{color:var(--economy-color)} .score-item.economy .score-value{color:var(--economy-color)}
        .score-item.doubt .score-name{color:var(--doubt-color)} .score-item.doubt .score-value{color:var(--doubt-color)}
        .score-item.innovation .score-name{color:var(--innov-color)} .score-item.innovation .score-value{color:var(--innov-color)}
        .score-flash { animation:scoreFlash 0.6s ease; }
        @keyframes scoreFlash { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
        #buff-area { background:var(--panel-bg);border:2px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:40px; }
        #buff-area .buff-title { font-weight:bold;color:var(--gold); }
        .buff-icon { background:#2a2018;border-radius:8px;padding:6px 10px;cursor:help;font-size:1.1em;border:1px solid var(--gold-dark); }
        #clue-shop { background:var(--panel-bg);border:2px solid var(--coin-color);border-radius:10px;padding:10px 16px;display:flex;flex-direction:column;gap:8px;transition:all 0.3s; }
        #clue-shop.collapsed { padding:8px 16px; }
        #clue-shop .shop-header { display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px; }
        #clue-shop .shop-title { font-size:1.1em;font-weight:bold;color:var(--coin-color); }
        #clue-shop .shop-info { font-size:0.8em;color:var(--text-dim); }
        #shop-toggle-btn { background:transparent;border:1px solid var(--coin-color);color:var(--coin-color);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:0.85em;font-weight:bold;transition:background 0.2s; }
        #shop-toggle-btn:hover { background:rgba(212,175,55,0.2); }
        .shop-cards-row { display:flex;flex-wrap:wrap;gap:8px;min-height:38px;transition:all 0.3s; }
        .shop-cards-row.hidden { display:none; }
        .shop-cards-row.empty::after { content:'(所有线索均已获得)';color:var(--text-dim);font-size:0.8em;font-style:italic;padding:4px 8px; }
        .shop-card { display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;width:var(--card-width);height:var(--card-height);border-radius:8px;border:2px solid var(--clue-color);cursor:pointer;font-size:0.72em;text-align:center;word-break:break-word;line-height:1.2;transition:all 0.2s;gap:4px;position:relative;overflow:hidden;background:var(--card-bg);padding:10px 8px; }
        .shop-card:hover { transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,0.5); }
        .shop-card .shop-card-price { font-size:0.75em;color:var(--coin-color);font-weight:bold;margin-top:auto; }
        .shop-card .shop-card-name { font-weight:bold;color:#80d090;font-size:0.85em; }
        .shop-card.disabled { opacity:0.5;cursor:not-allowed;pointer-events:none;filter:grayscale(0.8); }
        #hand-area { display:flex;flex-direction:column;gap:8px;flex:1; }
        .card-section { background:var(--panel-bg);border:2px solid var(--border);border-radius:8px;padding:8px 10px; }
        .card-section-header { display:flex;justify-content:space-between;align-items:center;font-size:0.9em;font-weight:bold;letter-spacing:1px;padding:2px 4px 6px 4px;color:var(--text-dim);border-bottom:1px solid var(--border);margin-bottom:8px; }
        .card-section-header .count { font-size:0.8em;color:var(--text-dim);font-weight:normal; }
        .cards-row { display:flex;flex-wrap:wrap;gap:8px;min-height:38px; }
        .cards-row.empty::after { content:'(空)';color:var(--text-dim);font-size:0.8em;font-style:italic;padding:4px 8px; }
        .card { display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;width:var(--card-width);height:var(--card-height);border-radius:8px;border:2px solid;cursor:grab;font-size:0.72em;text-align:center;word-break:break-word;line-height:1.2;transition:all 0.2s;position:relative;background:var(--card-bg);gap:4px;padding:12px 8px 8px;overflow:hidden; }
        .card:hover { transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,0.5);z-index:10; }
        .card:active { cursor:grabbing;transform:scale(0.96); }
        .card.dragging { opacity:0.4;transform:scale(0.9); }
        .card.marked { border-color:var(--gold); box-shadow:0 0 16px rgba(200,168,112,0.8); }
        .card .card-type-tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.7em; letter-spacing:1px; font-weight:bold; background:rgba(0,0,0,0.25); color:#fff; margin-bottom:2px; backdrop-filter:blur(2px); }
        .card .card-name { font-weight:bold;font-size:0.88em;margin-bottom:2px; }
        .card .card-bonus { font-size:0.65em;color:var(--text-dim); }
        .card.truth { border-color:var(--truth-color); background:linear-gradient(160deg,#3a2a10,#4a3518); border-style:solid; }
        .card.truth .card-type-tag { background:rgba(200,144,48,0.4); }
        .card.truth .card-name { color:#e8c070; }
        .card.truth::before { content:'📜'; position:absolute; top:4px; left:6px; font-size:1em; opacity:0.8; }
        .card.truth::after { content:'真相'; position:absolute; bottom:15%; left:50%; transform:translateX(-50%) rotate(-15deg); font-size:3em; color:rgba(200,144,48,0.2); font-weight:bold; pointer-events:none; z-index:0; }
        .card.key-question { border-color:var(--keyq-color); background:linear-gradient(160deg,#101830,#182540); border-style:dashed; }
        .card.key-question .card-type-tag { background:rgba(64,112,176,0.4); }
        .card.key-question .card-name { color:#80b0e0; }
        .card.key-question::before { content:'❓'; position:absolute; top:4px; left:6px; font-size:1em; opacity:0.8; }
        .card.key-question::after { content:'关键问题'; position:absolute; bottom:15%; left:50%; transform:translateX(-50%) rotate(-15deg); font-size:2.2em; color:rgba(64,112,176,0.2); font-weight:bold; pointer-events:none; z-index:0; }
        .card.ending { border-color:var(--ending-color); background:linear-gradient(160deg,#301010,#451818); border-style:double; }
        .card.ending .card-type-tag { background:rgba(192,80,80,0.4); }
        .card.ending .card-name { color:#90c0e0; }
        .card.ending::before { content:'🏁'; position:absolute; top:4px; left:6px; font-size:1em; opacity:0.8; }
        .card.ending::after { content:'结局'; position:absolute; bottom:15%; left:50%; transform:translateX(-50%) rotate(-15deg); font-size:3em; color:rgba(192,80,80,0.2); font-weight:bold; pointer-events:none; z-index:0; }
        .card.clue { border-color:var(--clue-color); background:linear-gradient(160deg,#102820,#183a2a); border-style:solid; }
        .card.clue .card-type-tag { background:rgba(80,160,96,0.4); }
        .card.clue .card-name { color:#80d090; }
        .card.clue::before { content:'🧩'; position:absolute; top:4px; left:6px; font-size:1em; opacity:0.8; }
        .card.clue::after { content:'线索'; position:absolute; bottom:15%; left:50%; transform:translateX(-50%) rotate(-15deg); font-size:3em; color:rgba(80,160,96,0.2); font-weight:bold; pointer-events:none; z-index:0; }
        .bonus-indicator { display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:auto;margin-bottom:2px;z-index:1; position:relative; }
        .bonus-dot { width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:0 0 4px rgba(0,0,0,0.4); }
        .bonus-dot.order { background:var(--order-color); }
        .bonus-dot.economy { background:var(--economy-color); }
        .bonus-dot.doubt { background:var(--doubt-color); }
        .bonus-dot.innovation { background:var(--innov-color); }
        .mark-label { margin-top:auto; width:100%; background:linear-gradient(180deg, rgba(200,168,112,0.95), rgba(100,70,30,0.95)); color:#fff; font-size:0.65em; font-weight:bold; padding:3px 4px; border-radius:4px; text-align:center; letter-spacing:0.5px; box-shadow:0 0 6px rgba(200,168,112,0.8); z-index:1; position:relative; }
        #button-area { display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:4px 0; }
        .faction-btn { flex:1;min-width:100px;max-width:180px;padding:14px 10px;border-radius:10px;border:3px solid;font-size:1.05em;font-weight:bold;letter-spacing:2px;cursor:pointer;transition:all 0.25s;background:var(--panel-bg); }
        .faction-btn:hover:not(:disabled) { transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,0.5); }
        .faction-btn.active { transform:translateY(-3px);box-shadow:0 6px 24px rgba(0,0,0,0.6);animation:pulseGlow 1.2s infinite alternate; }
        @keyframes pulseGlow { 0%{box-shadow:0 6px 18px rgba(0,0,0,0.5)} 100%{box-shadow:0 6px 28px rgba(200,168,112,0.5)} }
        .faction-btn .btn-score { display:block;font-size:0.7em;font-weight:normal;margin-top:3px;opacity:0.8; }
        .faction-btn.order{border-color:var(--order-color);color:var(--order-color)} .faction-btn.economy{border-color:var(--economy-color);color:var(--economy-color)}
        .faction-btn.doubt{border-color:var(--doubt-color);color:var(--doubt-color)} .faction-btn.innovation{border-color:var(--innov-color);color:var(--innov-color)}
        #execute-area { background:var(--panel-bg);border:2px solid var(--gold-dark);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:10px; }
        #execute-area.inactive { opacity:0.7;border-color:var(--border); }
        .execute-header { display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px; }
        #execute-faction-label { font-size:1em;font-weight:bold;letter-spacing:1px;color:var(--gold); }
        #execute-faction-label.inactive { color:var(--text-dim);font-style:italic; }
        #execute-slot { background:#1a1410;border:2px dashed var(--border);border-radius:8px;min-height:80px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center; }
        #execute-slot.drag-over { border-color:var(--gold);background:#2a2018; }
        #execute-slot .placeholder { color:var(--text-dim);font-size:0.8em;font-style:italic; }
        #execute-slot .card { cursor:pointer; }
        .execute-actions { display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center; }
        .panel-btn { padding:8px 20px;border-radius:8px;border:2px solid;font-size:0.9em;font-weight:bold;cursor:pointer;letter-spacing:1px; }
        .panel-btn:disabled { opacity:0.4;cursor:not-allowed; }
        #btn-execute { border-color:var(--gold);background:#3a2a10;color:var(--gold); }
        #btn-execute:hover:not(:disabled) { background:#4a3518; }
        #btn-clear-slot { border-color:var(--danger);background:#2a1510;color:var(--danger);font-size:0.8em;padding:6px 12px; }
        #toast-container { position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px;pointer-events:none; }
        .toast { background:var(--panel-bg);border:2px solid var(--border);border-radius:8px;padding:10px 14px;font-size:0.85em;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,0.5);animation:toastIn 0.3s ease,toastOut 0.4s ease 2.8s forwards;pointer-events:auto; }
        .toast.success{border-color:var(--success)} .toast.error{border-color:var(--danger)} .toast.locked{border-color:var(--gold)} .toast.info{border-color:var(--gold-dark)}
        @keyframes toastIn { from{transform:translateX(60px);opacity:0} to{transform:translateX(0);opacity:1} }
        @keyframes toastOut { to{transform:translateX(60px);opacity:0} }
        .sell-btn { margin-top:auto;background:transparent;border:1px solid var(--coin-color);color:var(--coin-color);border-radius:4px;padding:4px 10px;cursor:pointer;font-size:0.7em;pointer-events:auto;z-index:1; position:relative; }
        .sell-btn:hover { background:rgba(212,175,55,0.25); }
        @media (max-width:760px) { :root { --card-width:110px; --card-height:155px; } .faction-btn{min-width:70px;font-size:0.85em;padding:10px 6px} #title{font-size:1.1em} .score-item .score-value{font-size:1.3em} #execute-area{padding:10px 8px} #execute-slot{min-height:50px;padding:6px} .card.truth::after,.card.key-question::after,.card.ending::after,.card.clue::after{font-size:2em;} .mark-label{font-size:0.55em; padding:2px 2px;} }
    </style>
</head>
<body>
<div id="game-container">
    <div id="header">
        <span id="title">🔍 无名者档案</span>
        <span id="game-status">调查进行中...</span>
        <div id="gold-display"><span class="coin-icon"></span><span id="gold-amount">0</span> 金币</div>
    </div>
    <div id="debug-panel">
        <label>🛠️ 调试：</label><span>设置金币</span>
        <input type="number" id="debug-gold-input" min="0" value="0">
        <button id="debug-gold-btn">应用</button>
    </div>
    <div id="score-bar">
        <div class="score-item order" id="score-order"><div class="score-name">⚖️ 秩序</div><div class="score-value" id="score-val-order">3</div></div>
        <div class="score-item economy" id="score-economy"><div class="score-name">💰 经济</div><div class="score-value" id="score-val-economy">3</div></div>
        <div class="score-item doubt" id="score-doubt"><div class="score-name">🔍 质疑</div><div class="score-value" id="score-val-doubt">3</div></div>
        <div class="score-item innovation" id="score-innovation"><div class="score-name">💡 创新</div><div class="score-value" id="score-val-innovation">3</div></div>
    </div>
    <div id="buff-area"><span class="buff-title">🏆 Buff 奖励：</span><span id="buff-container">暂无</span></div>
    <div id="clue-shop">
        <div class="shop-header">
            <span class="shop-title">🛒 线索商店</span>
            <span class="shop-info">使用金币购买线索（买价10，卖价8）</span>
            <button id="shop-toggle-btn">收起 ▲</button>
        </div>
        <div class="shop-cards-row" id="shop-cards-row"></div>
    </div>
    <div id="hand-area">
        <div class="card-section" id="section-truth"><div class="card-section-header"><span>📜 真相卡</span><span class="count" id="count-truth">0</span></div><div class="cards-row" id="cards-truth"></div></div>
        <div class="card-section" id="section-keyq"><div class="card-section-header"><span>❓ 关键问题卡</span><span class="count" id="count-keyq">0</span></div><div class="cards-row" id="cards-keyq"></div></div>
        <div class="card-section" id="section-clue"><div class="card-section-header"><span>🧩 线索卡</span><span class="count" id="count-clue">0</span></div><div class="cards-row" id="cards-clue"></div></div>
        <div class="card-section" id="section-ending"><div class="card-section-header"><span>🏁 结局卡</span><span class="count" id="count-ending">0</span></div><div class="cards-row" id="cards-ending"></div></div>
    </div>
    <div id="button-area">
        <button class="faction-btn order" id="btn-order" data-faction="order">⚖️ 秩序<span class="btn-score">分数: <span id="btn-score-order">3</span></span></button>
        <button class="faction-btn economy" id="btn-economy" data-faction="economy">💰 经济<span class="btn-score">分数: <span id="btn-score-economy">3</span></span></button>
        <button class="faction-btn doubt" id="btn-doubt" data-faction="doubt">🔍 质疑<span class="btn-score">分数: <span id="btn-score-doubt">3</span></span></button>
        <button class="faction-btn innovation" id="btn-innovation" data-faction="innovation">💡 创新<span class="btn-score">分数: <span id="btn-score-innovation">3</span></span></button>
    </div>
    <div id="execute-area" class="inactive">
        <div class="execute-header"><span id="execute-faction-label" class="inactive">请先选择一个执行按钮</span></div>
        <div id="execute-slot"><span class="placeholder">将卡牌拖入此处（需先选择执行按钮）</span></div>
        <div class="execute-actions">
            <button class="panel-btn" id="btn-execute" disabled>⚡ 执行</button>
            <button class="panel-btn" id="btn-clear-slot">🗑️ 清空</button>
        </div>
    </div>
</div>
<div id="toast-container"></div>
<script>
(function() {
    const TYPE_LABELS = { 'truth':'真相','key-question':'关键问题','clue':'线索','ending':'结局' };
    const FACTION_KEYS = ['order','economy','doubt','innovation'];
    const FACTION_NAMES = { order:'秩序', economy:'经济', doubt:'质疑', innovation:'创新' };
    const FACTION_ICONS = { order:'⚖️', economy:'💰', doubt:'🔍', innovation:'💡' };

    const TRUTH_NAMES = ['谁动了我的脚踏车','无名者的发展','谁是内鬼？','谁举报了无名者？','Anta与母亲的关系是？','神秘男子是谁？','Shangri-la计划是什么？','Shangri-la计划是什么？2','Phoenix Bar为何突然终止营业？','旧城区为何至今存在？','Shangri-la计划的初衷是什么？','谁举报了我？或者说，谁毁了我的人生？','退休案的设立是为了解决什么问题？','母亲为何沉默','为何要公开这一切？','谁来参与直播？','Shangri-la委员会老档案里都有些什么？','等待的人们是谁？','爆炸案的真相是什么？','无名者究竟在做些什么？'];
    const truthCards = TRUTH_NAMES.map((name,i)=>({id:`TRUTH_${i}`, type:'truth', name, displayName:name, bonuses:[]}));
    const truthIdByName = {}; truthCards.forEach(c=>truthIdByName[c.name]=c.id);

    const CLUES_DATA = [
        ['被破坏的院子',[]], ['争吵',[]], ['碎掉的鸟蛋',[['innovation',1]]], ['联手罢工',[]], ['线下活动',[['innovation',1]]],
        ['学术研讨会',[['order',1]]], ['狂欢派对！',[['doubt',1]]], ['看星盘',[]], ['情绪化',[]], ['书记员',[['order',1]]],

    function isObtained(id){return state.obtainedCards.has(id);}
    function displayName(id){const d=getCardDef(id);return d?d.displayName:id;}
    function isTruthType(id){const d=getCardDef(id);return d&&d.type==='truth';}
    function getTotalScores(){
        const totals={...state.baseScores};
        for(const id of state.obtainedCards){const def=getCardDef(id);if(def)for(const b of(def.bonuses||[]))totals[b.faction]+=b.amount;}
        return totals;
    }
    function updateScoreUI(){
        const totals=getTotalScores();
        FACTION_KEYS.forEach(fk=>{document.getElementById(`score-val-${fk}`).textContent=totals[fk];document.getElementById(`btn-score-${fk}`).textContent=totals[fk];document.getElementById(`score-${fk}`).classList.toggle('low',totals[fk]<=0);});
        updateGoldUI();renderShop();
    }
    function updateGoldUI(){goldAmountEl.textContent=state.gold;}
    function flashScore(fk){const item=document.getElementById(`score-${fk}`);if(item){item.classList.add('score-flash');setTimeout(()=>item.classList.remove('score-flash'),650);}}
    function showToast(msg,type='info',duration=3200){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;toastContainer.appendChild(t);setTimeout(()=>t.remove(),duration+400);}

    function getClueColorClass(bonuses){ return ''; }

    function createCardElement(cardId){
        const def=getCardDef(cardId);
        const el=document.createElement('div');
        let cls=`card ${def.type}`;
        if(def.type==='clue'){const cc=getClueColorClass(def.bonuses||[]);if(cc)cls+=' '+cc;}
        el.className=cls;el.draggable=true;el.dataset.cardId=cardId;el.title=def.name;
        let bonusHtml='';
        const bonuses=def.bonuses||[];
        if(bonuses.length>0){
            const dots=bonuses.map(b=>`<span class="bonus-dot ${b.faction}"></span>`).join('');
            const text=bonuses.map(b=>`${FACTION_NAMES[b.faction]}+${b.amount}`).join(' ');
            bonusHtml=`<span class="bonus-indicator">${dots}</span><span class="card-bonus">${text}</span>`;
        }
        el.innerHTML=`<span class="card-type-tag">${TYPE_LABELS[def.type]}</span><span class="card-name">${def.displayName}</span>${bonusHtml}`;
        if(state.truthMarks[cardId]){
            el.classList.add('marked');
            el.title += ' (已标记：' + displayName(state.truthMarks[cardId]) + ')';
            const markLabel = document.createElement('div');
            markLabel.className = 'mark-label';
            markLabel.textContent = `🔒 ${displayName(state.truthMarks[cardId])}`;
            el.appendChild(markLabel);
        }
        el.addEventListener('dragstart',handleDragStart);el.addEventListener('dragend',handleDragEnd);
        el.addEventListener('click',e=>{if(state.gameEnded)return;if(e.target.closest('.sell-btn'))return;if(state.activeButton)tryAddToPanel(cardId);else showToast('请先选择一个执行按钮','error');});
        return el;
    }
    function createSellableClueElement(clueId){
        const def=getCardDef(clueId);
        const el=document.createElement('div');
        let cls='card clue'; const cc=getClueColorClass(def.bonuses||[]); if(cc)cls+=' '+cc;
        el.className=cls;el.draggable=true;el.dataset.cardId=clueId;el.title=def.name+' (点击卡片放入执行槽，点击按钮出售)';
        let bonusHtml='';
        const bonuses=def.bonuses||[];
        if(bonuses.length>0){
            const dots=bonuses.map(b=>`<span class="bonus-dot ${b.faction}"></span>`).join('');
            const text=bonuses.map(b=>`${FACTION_NAMES[b.faction]}+${b.amount}`).join(' ');
            bonusHtml=`<span class="bonus-indicator">${dots}</span><span class="card-bonus">${text}</span>`;
        }
        el.innerHTML=`<span class="card-type-tag">${TYPE_LABELS['clue']}</span><span class="card-name">${def.displayName}</span>${bonusHtml}<button class="sell-btn">卖${state.clueSellPrice}</button>`;
        el.addEventListener('dragstart',handleDragStart);el.addEventListener('dragend',handleDragEnd);
        el.addEventListener('click',e=>{if(e.target.closest('.sell-btn'))return;if(state.gameEnded)return;if(state.activeButton)tryAddToPanel(clueId);else showToast('请先选择一个执行按钮','error');});
        el.querySelector('.sell-btn').addEventListener('click',e=>{e.stopPropagation();sellClue(clueId);});
        return el;
    }
    function renderHand(){
        ['truth','key-question','ending'].forEach(type=>{
            const container=cardsContainers[type];const cards=state.hand[type]||[];container.innerHTML='';
            if(cards.length===0){container.classList.add('empty');}else{container.classList.remove('empty');cards.forEach(id=>container.appendChild(createCardElement(id)));}
            countsEls[type].textContent=cards.length;
        });
        const clueContainer=cardsContainers.clue;const clues=state.hand.clue||[];clueContainer.innerHTML='';
        if(clues.length===0){clueContainer.classList.add('empty');}else{clueContainer.classList.remove('empty');clues.forEach(id=>clueContainer.appendChild(createSellableClueElement(id)));}
        countsEls.clue.textContent=clues.length;
        updateFactionButtons();updateExecuteButtonState();updateBuffDisplay();
    }
    function updateFactionButtons(){FACTION_KEYS.forEach(fk=>{const btn=document.getElementById(`btn-${fk}`);if(btn){btn.disabled=state.gameEnded;btn.classList.toggle('active',state.activeButton===fk&&!state.gameEnded);}});}
    function updateExecuteButtonState(){btnExecute.disabled=!(state.panelCards.length>0&&state.activeButton&&!state.gameEnded);}
    function updateBuffDisplay(){
        const entries=Object.values(state.truthMarks).filter(id=>id);
        if(entries.length===0){buffContainer.textContent='暂无';return;}
        buffContainer.innerHTML='';
        entries.forEach(endingId=>{const buff=ENDING_BUFFS[endingId]||{name:'未知',icon:'❓'};const span=document.createElement('span');span.className='buff-icon';span.title=buff.icon+' '+buff.name+' ('+displayName(endingId)+')';span.textContent=buff.icon+' '+buff.name;buffContainer.appendChild(span);});
    }
    function handleDragStart(e){if(state.gameEnded){e.preventDefault();return;}const card=e.target.closest('.card');if(!card)return;e.dataTransfer.setData('text/plain',card.dataset.cardId);card.classList.add('dragging');window._draggedCardId=card.dataset.cardId;}
    function handleDragEnd(e){const card=e.target.closest('.card');if(card)card.classList.remove('dragging');window._draggedCardId=null;}
    executeSlot.addEventListener('dragover',e=>{e.preventDefault();if(state.activeButton&&!state.gameEnded){executeSlot.classList.add('drag-over');e.dataTransfer.dropEffect='move';}});
    executeSlot.addEventListener('dragleave',()=>executeSlot.classList.remove('drag-over'));
    executeSlot.addEventListener('drop',e=>{e.preventDefault();executeSlot.classList.remove('drag-over');if(state.gameEnded){showToast('游戏已结束','error');return;}if(!state.activeButton){showToast('请先选择执行按钮','error');return;}const id=e.dataTransfer.getData('text/plain')||window._draggedCardId;if(id)tryAddToPanel(id);window._draggedCardId=null;});
    function tryAddToPanel(cardId){
        if(!cardId||state.gameEnded)return;if(!state.activeButton){showToast('请先选择执行按钮','error');return;}if(!isObtained(cardId)){showToast('这张卡尚未获得','error');return;}if(state.panelCards.includes(cardId)){showToast('已在执行槽中','error');return;}
        state.panelCards.push(cardId);renderPanel();showToast(`已将「${displayName(cardId)}」放入执行槽`,'info',1500);
    }
    function renderPanel(){
        executeSlot.innerHTML='';
        if(state.panelCards.length===0){executeSlot.innerHTML='<span class="placeholder">将卡牌拖入此处</span>';}
        else{state.panelCards.forEach(id=>{const el=createCardElement(id);el.draggable=false;el.style.cursor='pointer';el.addEventListener('click',()=>removeFromPanel(id));executeSlot.appendChild(el);});}
        updateExecuteButtonState();
    }
    function removeFromPanel(id){state.panelCards=state.panelCards.filter(x=>x!==id);renderPanel();}
    function selectFaction(fk){
        if(state.gameEnded)return;
        if(state.activeButton===fk){state.activeButton=null;state.panelCards=[];updateExecuteAreaUI();renderPanel();}
        else{state.activeButton=fk;state.panelCards=[];updateExecuteAreaUI();renderPanel();}
        updateFactionButtons();
    }
    function updateExecuteAreaUI(){
        if(state.activeButton){executeArea.classList.remove('inactive');executeFactionLabel.classList.remove('inactive');executeFactionLabel.textContent=`${FACTION_ICONS[state.activeButton]} 当前执行按钮：${FACTION_NAMES[state.activeButton]}`;}
        else{executeArea.classList.add('inactive');executeFactionLabel.classList.add('inactive');executeFactionLabel.textContent='请先选择一个执行按钮';}
        updateExecuteButtonState();
    }
    FACTION_KEYS.forEach(fk=>{document.getElementById(`btn-${fk}`).addEventListener('click',()=>selectFaction(fk));});
    btnClearSlot.addEventListener('click',()=>{state.panelCards=[];renderPanel();showToast('已清空执行槽','info',1500);});
    btnExecute.addEventListener('click',()=>{
        if(state.gameEnded)return;if(!state.activeButton)return;if(state.panelCards.length===0)return;
        executeAction(state.activeButton,[...state.panelCards]);
    });

    function executeAction(currentFaction,cardIds){
        for(const id of cardIds){if(!isObtained(id)){showToast(`「${displayName(id)}」尚未获得`,'error');return;}}
        const truthIds=cardIds.filter(id=>isTruthType(id));
        const endingIds=cardIds.filter(id=>getCardDef(id)?.type==='ending');
        if(truthIds.length>0&&endingIds.length>0){
            if(truthIds.length!==1||endingIds.length!==1||cardIds.length!==2){showToast('标记结局需要恰好一张真相和一张结局','error');return;}
            const truthId=truthIds[0],endingId=endingIds[0];
            if(state.truthMarks[truthId]){showToast('该真相已标记，不可重复标记','error');return;}
            const total=getTotalScores()[currentFaction];
            if(total<state.markCost){showToast(`标记需要${state.markCost}点${FACTION_NAMES[currentFaction]}分数，当前不足`,'error');return;}
            state.baseScores[currentFaction]-=state.markCost;updateScoreUI();flashScore(currentFaction);
            state.truthMarks[truthId]=endingId;
            showToast(`⭐ 标记成功：${displayName(truthId)} → ${displayName(endingId)}`,'success',3000);
            state.panelCards=[];renderPanel();renderHand();return;
        }
        for(const rule of keyQuestionRules){
            const requiredIds = [rule.truthId, ...rule.clueIds];
            const req=[...requiredIds].sort();
            const have=[...cardIds].sort();
            if(req.length===have.length && req.every((v,i)=>v===have[i])){
                if(isObtained(rule.resultId)){showToast('该关键问题卡已获得','error');return;}
                state.obtainedCards.add(rule.resultId);state.hand['key-question'].push(rule.resultId);
                showToast(`✅ 获得「${displayName(rule.resultId)}」`,'success');
                state.panelCards=[];renderPanel();renderHand();return;
            }
        }
        for(const rule of endingRules){
            if(cardIds.length===1 && cardIds[0]===rule.keyqId){
                if(isObtained(rule.resultId)){showToast('该结局卡已获得','error');return;}
                const costFaction=rule.costFaction==='corresponding'?currentFaction:rule.costFaction;
                const total=getTotalScores()[costFaction];
                if(total<rule.costAmount){showToast(`需要消耗${rule.costAmount}点${FACTION_NAMES[costFaction]}分数，当前不足`,'error');return;}
                state.baseScores[costFaction]-=rule.costAmount;updateScoreUI();flashScore(costFaction);
                state.obtainedCards.add(rule.resultId);state.hand.ending.push(rule.resultId);
                showToast(`✅ 获得「${displayName(rule.resultId)}」（消耗${rule.costAmount}${FACTION_NAMES[costFaction]}）`,'success');
                state.panelCards=[];renderPanel();renderHand();return;
            }
        }
        showToast('当前组合无法执行任何操作','error');
    }

    function renderShop(){
        const available=clueCards.filter(c=>!isObtained(c.id)).map(c=>c.id);
        shopCardsRow.innerHTML='';
        if(available.length===0){shopCardsRow.classList.add('empty');return;}
        shopCardsRow.classList.remove('empty');
        available.forEach(clueId=>{
            const def=getCardDef(clueId);
            const el=document.createElement('div');
            let cls='shop-card';const cc=getClueColorClass(def.bonuses||[]);if(cc)cls+=' '+cc;
            el.className=cls;
            let dots='';const bonuses=def.bonuses||[];
            if(bonuses.length>0){dots=bonuses.map(b=>`<span class="bonus-dot ${b.faction}"></span>`).join('');}
            el.innerHTML=`<span class="shop-card-name">${def.displayName}</span>${dots?`<span class="bonus-indicator">${dots}</span>`:''}<span class="shop-card-price">💰 ${state.clueBuyPrice} 金币</span>`;
            if(state.gameEnded||state.gold<state.clueBuyPrice){el.classList.add('disabled');}else{el.addEventListener('click',()=>buyClue(clueId));}
            shopCardsRow.appendChild(el);
        });
    }
    function buyClue(clueId){
        if(state.gameEnded)return;if(isObtained(clueId))return;if(state.gold<state.clueBuyPrice){showToast('金币不足','error');return;}
        state.gold-=state.clueBuyPrice;state.obtainedCards.add(clueId);state.hand.clue.push(clueId);
        updateGoldUI();renderHand();renderShop();updateScoreUI();
        showToast(`🛒 购买「${displayName(clueId)}」`,'success');
    }
    function sellClue(clueId){
        if(!isObtained(clueId))return;
        state.hand.clue=state.hand.clue.filter(x=>x!==clueId);state.obtainedCards.delete(clueId);state.gold+=state.clueSellPrice;
        updateGoldUI();renderHand();renderShop();updateScoreUI();
        showToast(`💰 出售「${displayName(clueId)}」`,'success');
    }

    function setGoldFromDebug(){
        const val=parseInt(debugGoldInput.value,10);
        if(isNaN(val)||val<0){showToast('请输入非负整数','error');return;}
        state.gold=val;updateGoldUI();renderShop();
        showToast(`🔧 金币已设置为 ${state.gold}`,'success',2000);
    }
    debugGoldBtn.addEventListener('click',setGoldFromDebug);
    debugGoldInput.addEventListener('keypress',e=>{if(e.key==='Enter')setGoldFromDebug();});

    function toggleShop(){
        state.shopCollapsed=!state.shopCollapsed;
        if(state.shopCollapsed){
            shopCardsRow.classList.add('hidden');
            clueShop.classList.add('collapsed');
            shopToggleBtn.textContent='展开 ▼';
        }else{
            shopCardsRow.classList.remove('hidden');
            clueShop.classList.remove('collapsed');
            shopToggleBtn.textContent='收起 ▲';
        }
    }
    shopToggleBtn.addEventListener('click',toggleShop);

    updateScoreUI();updateGoldUI();updateExecuteAreaUI();renderPanel();renderHand();renderShop();updateBuffDisplay();
    showToast('🃏 游戏开始：所有真相卡已解锁，随机5张线索卡。组合对应真相与线索获得关键问题卡，再消耗分数获得结局。','info',6000);
})();
</script>
</body>
