<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 1 · 互动小说</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <section id="title-screen" class="screen active">
      <div class="title-bg"></div>
      <div class="title-particles"></div>
      <div class="title-content">
        <div class="title-logo">
          <h1 class="game-title">东南亚合集</h1>
          <div class="title-divider"></div>
          <p class="game-subtitle">互动小说</p>
        </div>
        <nav class="title-menu">
          <button id="start-btn" class="menu-btn menu-btn-primary">
            <span class="menu-btn-text">开始游戏</span>
            <span class="menu-btn-glow"></span>
          </button>
          <button class="menu-btn menu-btn-disabled" disabled>
            <span class="menu-btn-text">继续游戏</span>
          </button>
          <button class="menu-btn menu-btn-disabled" disabled>
            <span class="menu-btn-text">设置</span>
          </button>
          <button class="menu-btn menu-btn-disabled" disabled>
            <span class="menu-btn-text">退出游戏</span>
          </button>
        </nav>
        <footer class="title-footer">
          <p>Chapter 1 · 归来</p>
        </footer>
      </div>
    </section>

    <section id="story-screen" class="screen">
      <div class="game-canvas-wrap">
        <div id="game-canvas" class="game-canvas">
          <div class="story-viewport">
            <!-- 场景背景图（可替换） -->
            <div id="scene-bg" class="scene-bg">
              <img id="scene-bg-img" class="scene-bg-img" alt="" />
            </div>
            <!-- 角色立绘（可替换，有台词时显示） -->
            <div id="character-wrap" class="character-wrap hidden">
              <img id="character-img" class="character-img" alt="" />
            </div>
            <!-- 左上角文本框（方框）：场景念白 + 对话以历史记录形式展示 -->
            <div id="text-box" class="text-box">
              <div class="text-box-header">
                对话 <span class="text-box-hint">点击收起</span>
              </div>
              <div id="text-box-content" class="text-box-inner"></div>
            </div>
            <div id="choices-container" class="choices-container"></div>
            <!-- 右下角手机图标：打开菜单（仅非选项时显示） -->
            <button id="phone-btn" class="icon-btn hidden" title="菜单" aria-label="菜单">
              <svg class="phone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                <line x1="12" y1="18" x2="12" y2="18"/>
              </svg>
            </button>
            <!-- 房间导航按钮（左右切换） -->
            <div id="room-nav" class="room-nav hidden">
              <button id="room-nav-left" class="room-nav-btn room-nav-left" title="左侧">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 18 9 12 15 6"/>
                </svg>
              </button>
              <button id="room-nav-bottom" class="room-nav-btn room-nav-bottom" title="下方">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </button>
              <button id="room-nav-right" class="room-nav-btn room-nav-right" title="右侧">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="9 18 15 12 9 6"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="end-screen" class="screen">
      <div class="end-content">
        <h2>Chapter 1 · 完</h2>
        <p id="end-message" class="end-message"></p>
        <button id="restart-btn" class="btn-primary">重新开始</button>
      </div>
    </section>
  </div>
  <script src="assets/config.js"></script>
  <script src="script.js"></script>
</body>
</html>
