<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真相面板 - 调查游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #e74c3c;
            --success: #27ae60;
            --warning: #f39c12;
            --light: #ecf0f1;
            --dark: #1a252f;
            --order: #3498db;
            --innovation: #9b59b6;
            --question: #e67e22;
            --economy: #1abc9c;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: var(--light);
            overflow-x: hidden;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 顶部信息栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(44, 62, 80, 0.9);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .chapter-tabs {
            display: flex;
            gap: 10px;
        }

        .chapter-tab {
            padding: 10px 20px;
            background: var(--secondary);
            border: none;
            color: var(--light);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .chapter-tab:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .chapter-tab.active {
            background: var(--accent);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }

        .chapter-tab.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .faction-scores {
            display: flex;
            gap: 20px;
        }

        .faction-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            font-size: 13px;
        }

        .faction-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .faction-dot.order { background: var(--order); }
        .faction-dot.innovation { background: var(--innovation); }
        .faction-dot.question { background: var(--question); }
        .faction-dot.economy { background: var(--economy); }

        /* 主内容区 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        /* 真相选择区 */
        .truth-selection {
            background: rgba(44, 62, 80, 0.7);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .truth-selection h2 {
            margin-bottom: 20px;
            color: var(--accent);
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .truth-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .truth-card {
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .truth-card:hover:not(.locked):not(.completed) {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.2);
        }

        .truth-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .truth-card.completed {
            border-color: var(--success);
            background: linear-gradient(145deg, #1e4d3a, #2c5e47);
        }

        .truth-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .truth-card-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--light);
        }

        .truth-card-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
        }

        .truth-card-status.completed {
            background: var(--success);
        }

        .truth-card-desc {
            font-size: 13px;
            color: #bdc3c7;
            line-height: 1.5;
        }

        .truth-card-requirements {
            margin-top: 10px;
            font-size: 11px;
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 真相调查面板 */
        .truth-investigation {
            background: rgba(44, 62, 80, 0.9);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
        }

        .truth-investigation.active {
            display: block;
        }

        .investigation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .investigation-title {
            font-size: 22px;
            color: var(--accent);
        }

        .investigation-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            background: var(--warning);
        }

        .investigation-status.revealed {
            background: var(--success);
        }

        .close-investigation {
            background: var(--accent);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-investigation:hover {
            background: #c0392b;
        }

        /* 核心问题区域 */
        .core-question-area {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
        }

        .core-question-label {
            font-size: 12px;
            color: var(--warning);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .core-question-text {
            font-size: 24px;
            font-weight: bold;
            color: var(--light);
            margin-bottom: 20px;
        }

        /* 问题连线区域 */
        .questions-network {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        .key-question {
            background: var(--secondary);
            border-radius: 10px;
            padding: 15px 20px;
            min-width: 200px;
            max-width: 250px;
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .key-question:hover {
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .key-question.selected-yes {
            border-color: var(--success);
            background: rgba(39, 174, 96, 0.2);
        }

        .key-question.selected-no {
            border-color: var(--accent);
            background: rgba(231, 76, 60, 0.2);
        }

        .key-question.selected-doubt {
            border-color: var(--warning);
            background: rgba(243, 156, 18, 0.2);
        }

        .key-question.locked {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .key-question-header {
            font-size: 13px;
            color: #bdc3c7;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .key-question-text {
            font-size: 14px;
            color: var(--light);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .chain-progress, .followup-progress {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            background: rgba(255,255,255,0.15);
            margin-left: 5px;
        }

        .key-question.answered .chain-progress,
        .key-question.answered .followup-progress {
            background: rgba(39, 174, 96, 0.3);
        }

        .key-question-choices {
            display: flex;
            gap: 8px;
        }

        .choice-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            color: white;
        }

        .choice-btn.yes {
            background: var(--success);
        }

        .choice-btn.no {
            background: var(--accent);
        }

        .choice-btn.doubt {
            background: var(--warning);
        }

        .choice-btn:hover {
            transform: scale(1.05);
        }

        .choice-btn.active {
            box-shadow: 0 0 10px currentColor;
        }

        /* 证据提示 */
        .evidence-hint {
            font-size: 11px;
            color: var(--warning);
            margin-top: 8px;
            font-style: italic;
        }

        .evidence-hint.answered {
            color: var(--success);
        }

        /* 问题详情面板 */
        .question-detail {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .question-detail.active {
            display: block;
        }

        .question-detail h4 {
            color: var(--warning);
            margin-bottom: 15px;
        }

        .evidence-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .evidence-chain-container {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        .evidence-item {
            background: var(--secondary);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            cursor: grab;
            transition: all 0.3s;
            border: 2px dashed transparent;
            user-select: none;
        }

        .evidence-item:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .evidence-item.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .evidence-item.used {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .evidence-drop-zone {
            min-height: 60px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .evidence-drop-zone.drag-over {
            border-color: var(--accent);
            background: rgba(231, 76, 60, 0.1);
        }

        .evidence-drop-zone.correct {
            border-color: var(--success);
            background: rgba(39, 174, 96, 0.1);
        }

        .evidence-drop-zone.incorrect {
            border-color: var(--accent);
            background: rgba(231, 76, 60, 0.1);
        }

        .result-message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .result-message.success {
            display: block;
            background: rgba(39, 174, 96, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .result-message.failure {
            display: block;
            background: rgba(231, 76, 60, 0.2);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        /* 临时记忆空间栏 */
        .memory-panel {
            background: rgba(44, 62, 80, 0.9);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .memory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .memory-title {
            font-size: 16px;
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .memory-capacity {
            font-size: 12px;
            color: #bdc3c7;
        }

        .memory-slots {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .memory-follow-up-tag {
            margin-right: 5px;
        }

        .memory-parent {
            font-size: 10px;
            color: #95a5a6;
            margin-top: 3px;
        }

        .memory-slot {
            background: rgba(0,0,0,0.3);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 12px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .memory-slot.filled {
            border-style: solid;
            border-color: var(--warning);
            background: rgba(243, 156, 18, 0.1);
            justify-content: space-between;
        }

        .memory-slot.locked {
            opacity: 0.3;
        }

        .memory-content {
            font-size: 13px;
            color: var(--light);
            flex: 1;
        }

        .memory-remove {
            background: var(--accent);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .memory-empty {
            color: #7f8c8d;
            font-size: 12px;
        }

        /* 证据库 */
        .evidence-panel {
            background: rgba(44, 62, 80, 0.7);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .evidence-panel h3 {
            color: var(--light);
            margin-bottom: 15px;
            font-size: 15px;
        }

        .evidence-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* NPC 对话区域 */
        .npc-dialogue-area {
            background: rgba(44, 62, 80, 0.7);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .npc-dialogue-area h3 {
            color: var(--light);
            margin-bottom: 15px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .npc-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .npc-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .npc-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }

        .npc-button.locked {
            background: linear-gradient(135deg, #7f8c8d 0%, #6c7a7d 100%);
            cursor: not-allowed;
        }

        .npc-button.locked:hover {
            transform: none;
            box-shadow: none;
        }

        .npc-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .npc-chat {
            margin-top: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
        }

        .npc-chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .npc-name {
            font-weight: bold;
            color: var(--accent);
        }

        .close-chat {
            background: transparent;
            border: none;
            color: #bdc3c7;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .close-chat:hover {
            color: white;
        }

        .npc-chat-messages {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .chat-message {
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .chat-message.npc {
            background: rgba(52, 152, 219, 0.3);
            margin-right: 20px;
        }

        .chat-message.player {
            background: rgba(46, 204, 113, 0.3);
            margin-left: 20px;
            text-align: right;
        }

        .npc-chat-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-option {
            padding: 10px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: var(--light);
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .chat-option:hover:not(.locked) {
            background: rgba(255,255,255,0.2);
        }

        .chat-option.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-option.locked::after {
            content: ' [阵营要求不足]';
            color: #e74c3c;
            font-size: 12px;
        }

        .faction-req {
            font-size: 11px;
            color: #bdc3c7;
            margin-top: 4px;
        }

        /* 结局弹窗 */
        .ending-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .ending-modal.active {
            display: flex;
        }

        .ending-content {
            background: linear-gradient(145deg, #2c3e50, #1a252f);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            border: 2px solid var(--accent);
            animation: modalPop 0.3s ease-out;
        }

        @keyframes modalPop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .ending-title {
            font-size: 28px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .ending-desc {
            font-size: 16px;
            color: var(--light);
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .ending-bonus {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .bonus-item {
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 14px;
        }

        .bonus-item span {
            color: var(--success);
            font-weight: bold;
        }

        .ending-close {
            background: var(--accent);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .ending-close:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        /* 拖拽视觉反馈 */
        .drag-preview {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            background: var(--secondary);
            padding: 10px 15px;
            border-radius: 6px;
            border: 2px solid var(--accent);
            font-size: 13px;
            color: var(--light);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* SVG连线 */
        .connection-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .connection-line {
            stroke: rgba(255,255,255,0.2);
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5,5;
            animation: dash 20s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -100;
            }
        }

        /* 结局选择区 */
        .ending-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .ending-section h4 {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 14px;
        }

        .ending-options {
            display: grid;
            gap: 10px;
        }

        .ending-option {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .ending-option:hover {
            border-color: var(--accent);
        }

        .ending-option.recommended {
            border-color: var(--success);
        }

        .ending-option.selected {
            border-color: var(--accent);
            background: rgba(155, 89, 182, 0.2);
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.3);
        }

        .ending-req {
            font-size: 10px;
            color: #95a5a6;
            margin-top: 5px;
        }

        .ending-option-title {
            font-size: 14px;
            color: var(--light);
            margin-bottom: 5px;
        }

        .ending-option-desc {
            font-size: 12px;
            color: #bdc3c7;
        }

        .reveal-truth-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .reveal-truth-btn:hover:not(:disabled) {
            background: #c0392b;
            transform: scale(1.02);
        }

        .reveal-truth-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .top-bar {
                flex-direction: column;
                gap: 15px;
            }
            .faction-scores {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        /* 联想问题区域样式 */
        .follow-up-section {
            margin-top: 20px;
            padding-top: 15px;

        // ==================== 游戏状态 ====================
        let gameState = {
            currentChapter: 1,
            factionScores: { order: 0, innovation: 0, question: 0, economy: 0 },
            memorySlots: [],
            maxMemorySlots: 1,
            currentTruth: null,
            currentQuestion: null,
            completedTruths: [],
            revealedTruths: [],
            draggedEvidence: null,
            selectedEnding: null,  // debug功能：手动选择的结局
            // NPC 相关状态
            currentNpc: null,
            currentDialogueId: null,
            completedDialogues: [],  // 已完成的对话ID
            completedNpcs: [],  // 已完成的NPC
            unlockedEvidence: [],  // 已解锁的对话奖励证据
            claimedDialogueRewards: []  // 已领取的对话奖励
        };

        // ==================== 初始化 ====================
        function init() {
            renderChapterTabs();
            renderFactionScores();
            renderTruthCards();
            renderMemorySlots();
            renderEvidenceGrid();
            renderNpcList();
            updateMemoryCapacity();
            unlockNextChapter();
        }

        // ==================== NPC 对话系统 ====================

        // 检查阵营分数是否满足要求
        function checkFactionRequirement(factionReq) {
            if (!factionReq) return true;
            for (const [faction, value] of Object.entries(factionReq)) {
                if (gameState.factionScores[faction] < value) {
                    return false;
                }
            }
            return true;
        }

        // 渲染 NPC 列表
        function renderNpcList() {
            const container = document.getElementById('npcList');
            const currentChapter = gameState.currentChapter;
            const availableNpcs = gameData.npcs.filter(npc => npc.minChapter <= currentChapter);

            container.innerHTML = availableNpcs.map(npc => {
                const isInChat = gameState.currentNpc?.id === npc.id;
                const isCompleted = gameState.completedNpcs?.includes(npc.id);
                return `
                    <button class="npc-button ${isInChat ? 'active' : ''} ${isCompleted ? 'locked' : ''}"
                            onclick="${isCompleted ? '' : `openNpcChat('${npc.id}')`}"
                            ${isCompleted ? 'disabled' : ''}>
                        <span class="npc-avatar">${npc.avatar}</span>
                        <span>${npc.name}</span>
                        ${isCompleted ? '<span style="margin-left:5px;font-size:11px;">✓</span>' : ''}
                    </button>
                `;
            }).join('');
        }

        // 打开 NPC 对话
        function openNpcChat(npcId) {
            const npc = gameData.npcs.find(n => n.id === npcId);
            if (!npc) return;

            // 检查是否已完成
            if (gameState.completedNpcs?.includes(npc.id)) return;

            gameState.currentNpc = npc;
            gameState.currentDialogueId = null;  // 从第一个对话开始

            document.getElementById('npcChat').style.display = 'block';
            document.getElementById('currentNpcName').textContent = `${npc.name} - ${npc.location}`;

            renderNpcDialogue();
            renderNpcList();
        }

        // 关闭 NPC 对话
        function closeNpcChat() {
            document.getElementById('npcChat').style.display = 'none';
            gameState.currentNpc = null;
            gameState.currentDialogueId = null;
            renderNpcList();
        }

        // 渲染当前对话内容
        function renderNpcDialogue() {
            const npc = gameState.currentNpc;
            if (!npc) return;

            const messagesContainer = document.getElementById('npcChatMessages');
            const optionsContainer = document.getElementById('npcChatOptions');

            // 获取当前对话
            let currentDialogue = null;
            if (gameState.currentDialogueId) {
                currentDialogue = npc.dialogues.find(d => d.id === gameState.currentDialogueId);
            }

            // 如果没有当前对话，显示第一条
            if (!currentDialogue && npc.dialogues.length > 0) {
                currentDialogue = npc.dialogues[0];
                gameState.currentDialogueId = currentDialogue.id;
            }

            if (!currentDialogue) {
                messagesContainer.innerHTML = '<div class="chat-message npc">对话结束</div>';
                optionsContainer.innerHTML = '';
                return;
            }

            // 显示对话消息
            messagesContainer.innerHTML = `
                <div class="chat-message npc">${currentDialogue.text}</div>
            `;

            // 显示对话选项
            const factionNames = { order: '秩序', innovation: '创新', question: '质疑', economy: '经济' };

            optionsContainer.innerHTML = currentDialogue.options.map(option => {
                const canSelect = checkFactionRequirement(option.factionReq);
                const reqText = option.factionReq ?
                    Object.entries(option.factionReq).map(([k, v]) => `${factionNames[k]} ${v}`).join(', ') :
                    null;

                return `
                    <button class="chat-option ${canSelect ? '' : 'locked'}"
                            onclick="${canSelect ? `selectDialogueOption('${option.id}')` : ''}"
                            ${canSelect ? '' : 'disabled'}>
                        <div>${option.text}</div>
                        ${reqText ? `<div class="faction-req">需要: ${reqText}</div>` : ''}
                    </button>
                `;
            }).join('');
        }

        // 选择对话选项
        function selectDialogueOption(optionId) {
            const npc = gameState.currentNpc;
            if (!npc) return;

            const dialogue = npc.dialogues.find(d => d.id === gameState.currentDialogueId);
            if (!dialogue) return;

            const option = dialogue.options.find(o => o.id === optionId);
            if (!option) return;

            // 添加玩家回复
            const messagesContainer = document.getElementById('npcChatMessages');
            const playerMsg = document.createElement('div');
            playerMsg.className = 'chat-message player';
            playerMsg.textContent = option.text;
            messagesContainer.appendChild(playerMsg);

            // 即时发放奖励（仅首次）
            if (option.reward) {
                const claimKey = `${npc.id}:${option.id}`;
                if (!gameState.claimedDialogueRewards?.includes(claimKey)) {
                    // 发放阵营分数
                    if (option.reward.points) {
                        Object.entries(option.reward.points).forEach(([faction, points]) => {
                            gameState.factionScores[faction] += points;
                        });
                    }
                    // 发放证据
                    if (option.reward.evidence) {
                        const evidence = gameData.evidence.find(e => e.id === option.reward.evidence);
                        if (evidence) {
                            if (!gameState.unlockedEvidence) gameState.unlockedEvidence = [];
                            if (!gameState.unlockedEvidence.includes(evidence.id)) {
                                gameState.unlockedEvidence.push(evidence.id);
                            }
                        }
                    }
                    // 标记为已领取
                    if (!gameState.claimedDialogueRewards) gameState.claimedDialogueRewards = [];
                    gameState.claimedDialogueRewards.push(claimKey);
                    
                    // 显示获得提示
                    setTimeout(() => {
                        let rewardText = '';
                        if (option.reward.points) {
                            const names = { order: '秩序', innovation: '创新', question: '质疑', economy: '经济' };
                            Object.entries(option.reward.points).forEach(([f, p]) => {
                                rewardText += `${names[f]} +${p} `;
                            });
                        }
                        if (option.reward.evidence) {
                            const ev = gameData.evidence.find(e => e.id === option.reward.evidence);
                            if (ev) rewardText += `获得: ${ev.name}`;
                        }
                        if (rewardText) alert(`🎁 ${rewardText}`);
                    }, 100);
                }
            }

            // 滚动到底部
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // 延迟显示下一个对话
            setTimeout(() => {
                if (option.nextId) {
                    gameState.currentDialogueId = option.nextId;
                    renderNpcDialogue();
                } else {
                    // 对话结束
                    finishNpcDialogue();
                }
            }, 500);
        }

        // 完成对话
        function finishNpcDialogue() {
            const npc = gameState.currentNpc;
            
            // 检查该NPC是否所有对话都已完成
            const allDone = npc.dialogues.every(d => 
                d.options.some(opt => opt.nextId === null && gameState.claimedDialogueRewards?.includes(`${npc.id}:${opt.id}`))
            );
            
            if (allDone) {
                if (!gameState.completedNpcs) gameState.completedNpcs = [];
                if (!gameState.completedNpcs.includes(npc.id)) {
                    gameState.completedNpcs.push(npc.id);
                }
            }

            // 更新UI
            renderFactionScores();
            renderEvidenceGrid();
            renderNpcList();

            // 关闭对话框
            document.getElementById('npcChat').style.display = 'none';
            gameState.currentNpc = null;
            gameState.currentDialogueId = null;
        }

        // 处理对话奖励（保留兼容）
        function processDialogueReward(reward) { }

        // ==================== Debug面板 ====================
        function openDebugPanel() {
            const panel = document.getElementById('debugPanel');
            document.getElementById('debugOrder').value = gameState.factionScores.order;
            document.getElementById('debugInnovation').value = gameState.factionScores.innovation;
            document.getElementById('debugQuestion').value = gameState.factionScores.question;
            document.getElementById('debugEconomy').value = gameState.factionScores.economy;
            panel.style.display = 'flex';
        }

        function closeDebugPanel() {
            document.getElementById('debugPanel').style.display = 'none';
        }

        function applyDebugScores() {
            gameState.factionScores.order = parseInt(document.getElementById('debugOrder').value) || 0;
            gameState.factionScores.innovation = parseInt(document.getElementById('debugInnovation').value) || 0;
            gameState.factionScores.question = parseInt(document.getElementById('debugQuestion').value) || 0;
            gameState.factionScores.economy = parseInt(document.getElementById('debugEconomy').value) || 0;
            renderFactionScores();
            closeDebugPanel();
        }

        // ==================== 渲染函数 ====================
        function renderChapterTabs() {
            const container = document.getElementById('chapterTabs');
            container.innerHTML = gameData.chapters.map(chapter => `
                <button class="chapter-tab ${chapter.id === gameState.currentChapter ? 'active' : ''} ${chapter.locked ? 'locked' : ''}"
                        onclick="switchChapter(${chapter.id})"
                        ${chapter.locked ? 'disabled' : ''}>
                    ${chapter.title}
                </button>
            `).join('');
        }

        function renderFactionScores() {
            const container = document.getElementById('factionScores');
            const factions = [
                { key: 'order', name: '秩序', color: 'var(--order)' },
                { key: 'innovation', name: '创新', color: 'var(--innovation)' },
                { key: 'question', name: '质疑', color: 'var(--question)' },
                { key: 'economy', name: '经济', color: 'var(--economy)' }
            ];
            container.innerHTML = factions.map(f => `
                <div class="faction-item">
                    <span class="faction-dot ${f.key}" style="background: ${f.color}"></span>
                    <span>${f.name}: ${gameState.factionScores[f.key]}</span>
                </div>
            `).join('');
        }

        function renderTruthCards() {
            const container = document.getElementById('truthCards');
            const chapter = gameData.chapters.find(c => c.id === gameState.currentChapter);
            if (!chapter) return;

            container.innerHTML = chapter.truths.map(truth => {
                const isRevealed = gameState.revealedTruths.includes(truth.id);
                const isLocked = checkTruthLocked(truth);
                const status = isRevealed ? 'completed' : (isLocked ? 'locked' : '');

                return `
                    <div class="truth-card ${status}" onclick="${!isLocked && !isRevealed ? `openTruth('${truth.id}')` : ''}">
                        <div class="truth-card-header">
                            <span class="truth-card-title">${truth.title}</span>
                            <span class="truth-card-status ${isRevealed ? 'completed' : ''}">
                                ${isRevealed ? '已公开' : (isLocked ? '未解锁' : '待调查')}
                            </span>
                        </div>
                        <p class="truth-card-desc">${truth.description}</p>
                        ${truth.requirement ? `
                            <div class="truth-card-requirements">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                ${truth.requirement.factionReq ? `需要: ${formatRequirements(truth.requirement)}` : '需要先完成前置真相'}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function checkTruthLocked(truth) {
            if (!truth.requirement) return false;
            
            // 阵营分数要求检查
            if (truth.requirement.factionReq) {
                return !checkFactionRequirement(truth.requirement.factionReq);
            }
            
            // 真相完成数要求检查
            if (truth.requirement.truthsCompleted !== undefined) {
                return gameState.revealedTruths.length < truth.requirement.truthsCompleted;
            }
            
            return false;
        }

        function renderMemorySlots() {
            const container = document.getElementById('memorySlots');
            let html = '';
            for (let i = 0; i < 5; i++) {
                const isLocked = i >= gameState.maxMemorySlots;
                const slot = gameState.memorySlots[i];
                const isFilled = slot !== undefined;

                html += `
                    <div class="memory-slot ${isFilled ? 'filled' : ''} ${isLocked ? 'locked' : ''}">
                        ${isFilled ? `
                            ${slot.type === 'followUp' ? `<span class="memory-follow-up-tag">💭</span>` : ''}
                            <span class="memory-content">${slot.text}</span>
                            ${slot.parentQuestion ? `<div class="memory-parent">来自: ${slot.parentQuestion}</div>` : ''}
                            <button class="memory-remove" onclick="removeFromMemory(${i})">移除</button>
                        ` : `
                            <span class="memory-empty">${isLocked ? '未解锁' : '空槽位'}</span>
                        `}
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function updateMemoryCapacity() {
            const total = gameState.factionScores.order + gameState.factionScores.innovation + 
                         gameState.factionScores.question + gameState.factionScores.economy;
            gameState.maxMemorySlots = Math.min(5, 1 + Math.floor(total / 5));
            document.getElementById('memoryCapacity').textContent = 
                `${gameState.memorySlots.filter(s => s !== undefined).length}/${gameState.maxMemorySlots}`;
            renderMemorySlots();
        }

        function renderEvidenceGrid() {
            const container = document.getElementById('evidenceGrid');
            const unlockedDialogueEvidence = gameState.unlockedEvidence || [];
            
            // 本章初始证据 + 已解锁的对话奖励证据(chapter=0)
            const chapterEvidence = gameData.evidence.filter(e => {
                // 本章初始证据
                if (e.chapter === gameState.currentChapter) return true;
                // 已解锁的对话奖励证据
                if (e.chapter === 0 && unlockedDialogueEvidence.includes(e.id)) return true;
                return false;
            });
            
            container.innerHTML = chapterEvidence.map(e => `
                <div class="evidence-item ${e.used ? 'used' : ''} ${e.chapter === 0 ? 'dialogue-reward' : ''}" 
                     draggable="${!e.used}"
                     ondragstart="onDragStart(event, '${e.id}')"
                     ondragend="onDragEnd(event)">
                    ${e.name}${e.chapter === 0 ? ' ⭐' : ''}
                </div>
            `).join('');
        }

        // ==================== 章节切换 ====================
        function switchChapter(chapterId) {
            const chapter = gameData.chapters.find(c => c.id === chapterId);
            if (chapter && !chapter.locked) {
                gameState.currentChapter = chapterId;
                gameState.currentTruth = null;
                closeInvestigation();
                renderChapterTabs();
                renderTruthCards();
                renderEvidenceGrid();
            }
        }

        // ==================== 真相面板操作 ====================
        function openTruth(truthId) {
            const chapter = gameData.chapters.find(c => c.id === gameState.currentChapter);
            const truth = chapter.truths.find(t => t.id === truthId);
            
            if (!truth || checkTruthLocked(truth) || gameState.revealedTruths.includes(truthId)) return;

            gameState.currentTruth = truth;
            gameState.currentQuestion = null;

            document.getElementById('truthSelection').style.display = 'none';
            document.getElementById('truthInvestigation').classList.add('active');
            
            document.getElementById('investigationTitle').textContent = truth.title;
            document.getElementById('coreQuestionText').textContent = truth.coreQuestion;
            document.getElementById('investigationStatus').textContent = '调查中';
            document.getElementById('investigationStatus').classList.remove('revealed');

            renderKeyQuestions();
            renderEndings();
        }

        function renderKeyQuestions() {
            const container = document.getElementById('questionsNetwork');
            const truth = gameState.currentTruth;
            if (!truth) return;

            container.innerHTML = truth.keyQuestions.map(q => {
                let choiceClass = '';
                if (q.userChoice === 'yes') choiceClass = 'selected-yes';
                else if (q.userChoice === 'no') choiceClass = 'selected-no';
                else if (q.userChoice === 'doubt') choiceClass = 'selected-doubt';

                // 计算证据链条进度
                const chainProgress = q.evidenceChain ?
                    `${q.evidenceChain.filter(e => e.verified).length}/${q.evidenceChain.length}` : '0/0';

                // 只有当前调查的问题才显示证据链状态
                const isCurrentQuestion = gameState.currentQuestion && gameState.currentQuestion.id === q.id;

                // 计算联想问题进度
                let followUpCount = 0;
                if (q.evidenceChain) {
                    q.evidenceChain.forEach(e => {
                        if (e.followUpQuestion && e.followUpQuestion.unlocked) {
                            followUpCount++;
                        }
                    });
                }
                const followUpProgress = followUpCount > 0 ? `${followUpCount}个联想问题` : '';

                // 问题已选择时禁用按钮
                const hasChoice = q.userChoice !== null;

                return `
                    <div class="key-question ${choiceClass} ${!q.unlocked ? 'locked' : ''} ${isCurrentQuestion ? 'current' : ''}"
                         data-question-id="${q.id}">
                        <div class="key-question-header">
                            关键问题
                            ${isCurrentQuestion && q.userChoice === 'doubt' ? `<span class="chain-progress" title="证据链条">🔗 ${chainProgress}</span>` : ''}
                            ${followUpProgress ? `<span class="followup-progress" title="联想问题">💭 ${followUpProgress}</span>` : ''}
                        </div>
                        <div class="key-question-text">${q.text}</div>
                        <div class="key-question-choices">
                            <button class="choice-btn yes ${q.userChoice === 'yes' ? 'active' : ''}"
                                    onclick="selectChoice('${q.id}', 'yes')"
                                    ${hasChoice || !q.unlocked ? 'disabled' : ''}>是</button>
                            <button class="choice-btn no ${q.userChoice === 'no' ? 'active' : ''}"
                                    onclick="selectChoice('${q.id}', 'no')"
                                    ${hasChoice || !q.unlocked ? 'disabled' : ''}>否</button>
                            <button class="choice-btn doubt ${q.userChoice === 'doubt' ? 'active' : ''}"
                                    onclick="selectChoice('${q.id}', 'doubt')"
                                    ${hasChoice || !q.unlocked ? 'disabled' : ''}>存疑</button>
                        </div>
                        <div class="evidence-hint ${q.answered ? 'answered' : ''}">
                            ${q.answered ? '✓ 已完成' : (q.userChoice ? '✓ 已选择' : '')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeInvestigation() {
            gameState.currentTruth = null;
            gameState.currentQuestion = null;
            document.getElementById('truthSelection').style.display = 'block';
            document.getElementById('truthInvestigation').classList.remove('active');
            document.getElementById('questionDetail').classList.remove('active');
            renderTruthCards();
        }

        // ==================== 问题选择 ====================
        function selectChoice(questionId, choice) {
            const truth = gameState.currentTruth;
            if (!truth) return;
            
            const question = truth.keyQuestions.find(q => q.id === questionId);
            if (!question || !question.unlocked) return;

            // 如果问题已有选择，不再允许修改
            if (question.userChoice !== null) return;

            question.userChoice = choice;
            renderKeyQuestions();

            // 如果选择"是"或"否"，直接完成问题，不再触发后续
            if (choice === 'yes' || choice === 'no') {
                question.answered = true;
                
                // 如果当前打开的是这个问题的详情面板，关闭它
                if (gameState.currentQuestion && gameState.currentQuestion.id === questionId) {
                    closeQuestionDetail();
                }
                
                // 显示简短提示
                const resultMsg = document.getElementById('resultMessage');
                resultMsg.className = 'result-message success';
                resultMsg.textContent = choice === question.answer ? '✓ 选择正确！' : '✗ 选择错误';
                
                // 3秒后隐藏提示
                setTimeout(() => {
                    resultMsg.textContent = '';
                }, 3000);
                return;
            }

            // 只有选择"存疑"才继续后续流程
            // 显示问题详情面板
            gameState.currentQuestion = question;
            showQuestionDetail(question);
        }

        // 关闭问题详情面板
        function closeQuestionDetail() {
            const detailPanel = document.getElementById('questionDetail');
            detailPanel.classList.remove('active');
            gameState.currentQuestion = null;
            
            // 显示证据库
            const evidencePanel = document.querySelector('.evidence-panel');
            if (evidencePanel) {
                evidencePanel.style.display = 'block';
            }
        }

        function showQuestionDetail(question) {
            const detailPanel = document.getElementById('questionDetail');
            detailPanel.classList.add('active');

            document.getElementById('detailQuestionText').textContent = question.text;
            
            // 只有存疑选择才显示证据链提示
            if (question.userChoice === 'doubt') {
                const chainComplete = question.evidenceChain ? 
                    question.evidenceChain.every(e => e.verified) : true;
                const hintText = chainComplete 
                    ? '✓ 证据链条已完全验证' 
                    : '请按顺序拖拽证据验证证据链条';
                document.getElementById('detailEvidenceHint').textContent = hintText;
            } else {
                document.getElementById('detailEvidenceHint').textContent = '';
            }

            // 渲染证据链条（只有存疑才显示）
            renderEvidenceChain(question);

            // 渲染联想问题（只有存疑才显示）
            renderFollowUpQuestions(question);

            // 更新保存到记忆按钮状态
            updateSaveMemoryButton(question);

            // 渲染可用证据（只有存疑才显示）
            renderAvailableEvidence(question);

            // 重置结果消息
            const resultMsg = document.getElementById('resultMessage');
            resultMsg.className = 'result-message';
            resultMsg.textContent = '';

            // 重置拖拽区域
            const dropZone = document.getElementById('evidenceDropZone');
            dropZone.className = 'evidence-drop-zone';
            dropZone.innerHTML = '<span class="memory-empty">拖拽证据到此处</span>';
        }

        // 渲染证据链条
        function renderEvidenceChain(question) {
            const container = document.getElementById('evidenceChainContainer');
            
            if (!question.evidenceChain) {
                container.innerHTML = '';
                return;
            }

            let html = '<div style="margin-bottom: 15px;"><strong style="color: var(--warning);">🔗 证据链条（按顺序验证）</strong></div>';
            
            question.evidenceChain.forEach((step, index) => {
                const isCurrent = !step.verified && step.unlocked;
                const statusClass = step.verified ? 'completed' : (step.unlocked ? 'current' : 'locked');
                const statusText = step.verified ? '✓ 已验证' : (step.unlocked ? '待验证' : '🔒 未解锁');
                
                html += `
                    <div class="evidence-chain-step ${statusClass}">
                        <div class="chain-step-header">
                            <span class="chain-step-number">步骤 ${index + 1}</span>
                            <span class="chain-step-status ${step.verified ? 'completed' : ''}">${statusText}</span>
                        </div>
                        <div class="chain-evidence-name">📎 ${step.evidence}</div>
                        <div class="chain-hint">${isCurrent ? step.hint : (step.verified ? '已验证线索' : (step.unlocked ? step.hint : '请先完成上一步'))}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 渲染联想问题（只有存疑才显示，且不需要选择答案）
        function renderFollowUpQuestions(question) {
            const section = document.getElementById('followUpSection');
            const container = document.getElementById('followUpQuestions');

            // 只有存疑选择才显示联想问题
            if (!question.evidenceChain || question.userChoice !== 'doubt') {
                section.style.display = 'none';
                return;
            }

            const unlockedFollowUps = question.evidenceChain
                .filter(e => e.followUpQuestion && e.followUpQuestion.unlocked)
                .map(e => e.followUpQuestion);

            if (unlockedFollowUps.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            
            let html = '';
            unlockedFollowUps.forEach(fq => {
                html += `
                    <div class="follow-up-item">
                        <div class="question-text">💭 ${fq.text}</div>
                        <div class="evidence-hint">可直接拖拽证据验证，或存入临时记忆</div>
                    </div>
                `;
            });

            container.innerHTML = html;
            
            // 总是显示保存到记忆按钮（如果有待处理的联想问题）
            const btn = document.getElementById('saveToMemoryBtn');
            btn.style.display = 'block';
        }

        // 更新保存到记忆按钮状态
        function updateSaveMemoryButton(question) {
            const btn = document.getElementById('saveToMemoryBtn');
            
            // 只有存疑选择且有联想问题时才显示按钮
            if (!question.evidenceChain || question.userChoice !== 'doubt') {
                btn.style.display = 'none';
                return;
            }

            const hasFollowUps = question.evidenceChain.some(e => 
                e.followUpQuestion && e.followUpQuestion.unlocked
            );

            btn.style.display = hasFollowUps ? 'block' : 'none';
        }

        // 保存到临时记忆
        function saveToMemory() {
            const question = gameState.currentQuestion;
            if (!question || !question.evidenceChain) return;

            // 收集所有已解锁的联想问题（不再需要选择答案）
            const followUpsToSave = [];
            question.evidenceChain.forEach(e => {
                if (e.followUpQuestion && e.followUpQuestion.unlocked) {
                    followUpsToSave.push({
                        text: e.followUpQuestion.text,
                        questionId: e.followUpQuestion.id,
                        parentQuestion: question.text,
                        chainEvidence: e.evidence // 记录是哪个证据链解锁的
                    });
                }
            });

            if (followUpsToSave.length === 0) return;

            let savedCount = 0;
            // 检查记忆空间，逐个保存
            followUpsToSave.forEach(fu => {
                if (gameState.memorySlots.length >= gameState.maxMemorySlots) {
                    // 空间不足时停止
                    if (savedCount === 0) {
                        alert('记忆空间不足！');
                    } else {
                        alert(`记忆空间不足，已保存 ${savedCount} 条`);
                    }
                    return;
                }

                gameState.memorySlots.push({
                    text: fu.text,
                    questionId: fu.questionId,
                    parentQuestion: fu.parentQuestion,
                    chainEvidence: fu.chainEvidence,
                    type: 'followUp'
                });
                savedCount++;
            });

            if (savedCount > 0) {
                renderMemorySlots();
                updateMemoryCapacity();
                // 隐藏联想问题区域（已全部保存）
                document.getElementById('followUpSection').style.display = 'none';
                document.getElementById('saveToMemoryBtn').style.display = 'none';
                
                // 显示提示
                const resultMsg = document.getElementById('resultMessage');
                resultMsg.className = 'result-message success';
                resultMsg.textContent = `已存入 ${savedCount} 条联想问题到临时记忆`;
                setTimeout(() => {
                    resultMsg.textContent = '';
                }, 3000);
            }
        }

        function renderAvailableEvidence(question) {
            const container = document.getElementById('availableEvidence');
            const chapterEvidence = gameData.evidence.filter(e => e.chapter === gameState.currentChapter && !e.used);
            
            // 如果有证据链条，找到当前步骤需要的证据
            let headerText = '可拖拽证据：';
            if (question.evidenceChain) {
                const currentStep = question.evidenceChain.find(s => !s.verified && s.unlocked);
                if (currentStep) {
                    headerText = `📋 当前需要验证：<strong>${currentStep.evidence}</strong>`;
                } else if (question.evidenceChain.every(s => s.verified)) {
                    headerText = '✓ 所有证据已验证完毕';
                }
            }
            
            container.innerHTML = `
                <div style="margin-bottom: 10px; color: var(--light); font-size: 13px;">
                    ${headerText}
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                    ${chapterEvidence.map(e => `
                        <div class="evidence-item" 
                             draggable="true"
                             ondragstart="onDragStart(event, '${e.id}')"
                             ondragend="onDragEnd(event)">
                            ${e.name}
                        </div>
                    `).join('')}
                </div>
            `;

            // 隐藏证据库
            document.querySelector('.evidence-panel').style.display = 'none';
        }

        // ==================== 拖拽系统 ====================
        function onDragStart(event, evidenceId) {
            gameState.draggedEvidence = evidenceId;
            event.target.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
        }

        function onDragEnd(event) {
            event.target.classList.remove('dragging');
            gameState.draggedEvidence = null;
        }

        function setupDropZone() {
            const dropZone = document.getElementById('evidenceDropZone');
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                
                if (gameState.draggedEvidence && gameState.currentQuestion) {
                    verifyEvidence(gameState.draggedEvidence, gameState.currentQuestion);
                }
            });
        }

        function verifyEvidence(evidenceId, question) {
            const evidence = gameData.evidence.find(e => e.id === evidenceId);
            const dropZone = document.getElementById('evidenceDropZone');
            const resultMsg = document.getElementById('resultMessage');

            // 如果有证据链条，按链条验证
            if (question.evidenceChain) {
                // 找到当前需要验证的步骤
                const currentStep = question.evidenceChain.find(s => !s.verified && s.unlocked);
                
                if (!currentStep) {
                    // 所有步骤已完成，不显示任何提示
                    resultMsg.className = 'result-message';
                    resultMsg.textContent = '';
                    return;
                }

                // 检查证据是否匹配当前步骤
                const isCorrect = currentStep.evidence === evidence.name;

                if (isCorrect) {
                    // 正确证据
                    evidence.used = true;
                    currentStep.verified = true;
                    
                    dropZone.classList.add('correct');
                    // 不覆盖拖拽区域内容，只添加视觉反馈
                    // dropZone.innerHTML = `<span style="color: var(--success);">✓ 证据有效！步骤 ${question.evidenceChain.indexOf(currentStep) + 1} 完成</span>`;
                    
                    resultMsg.className = 'result-message success';
                    resultMsg.textContent = currentStep.followUpQuestion ? 
                        `发现联想问题"${currentStep.followUpQuestion.text}"` :
                        '验证成功！';

                    // 如果有联想问题，解锁它
                    if (currentStep.followUpQuestion) {
                        currentStep.followUpQuestion.unlocked = true;
                        resultMsg.textContent += ' 已解锁联想问题！';
                    }

                    // 检查是否所有链条都完成了
                    const allVerified = question.evidenceChain.every(s => s.verified);
                    if (allVerified) {
                        question.answered = true;
                        // 添加阵营分数
                        Object.keys(question.factionPoints).forEach(key => {
                            if (question.userChoice === question.answer) {
                                gameState.factionScores[key] += question.factionPoints[key];
                            }
                        });
                        resultMsg.textContent += ' 证据链条完成！';
                    } else {
                        // 解锁下一步
                        const nextIndex = question.evidenceChain.indexOf(currentStep) + 1;
                        if (nextIndex < question.evidenceChain.length) {
                            question.evidenceChain[nextIndex].unlocked = true;
                        }
                    }

                    renderFactionScores();
                    updateMemoryCapacity();
                    renderEvidenceGrid();
                    renderKeyQuestions();
                    renderEvidenceChain(question);
                    renderAvailableEvidence(question);
                    renderFollowUpQuestions(question);
                    updateSaveMemoryButton(question);

                    // 验证成功后重置拖拽区域
                    setTimeout(() => {
                        dropZone.classList.remove('correct');
                    }, 300);

                    // 检查是否解锁新问题
                    checkUnlockNewQuestions();
                } else {
                    // 错误证据
                    dropZone.classList.add('incorrect');
                    // 不覆盖拖拽区域内容
                    
                    resultMsg.className = 'result-message failure';
                    resultMsg.textContent = `这个证据不能验证当前步骤。当前需要验证：${currentStep.evidence}`;
                }
                return;
            }

            // 旧版逻辑：直接验证
            const isCorrect = question.evidenceRequired && question.evidenceRequired.includes(evidence.name);

            if (isCorrect) {
                evidence.used = true;
                question.answered = true;
                
                dropZone.classList.add('correct');
                // 不覆盖拖拽区域内容
                
                resultMsg.className = 'result-message success';
                resultMsg.textContent = '验证通过！';

                Object.keys(question.factionPoints).forEach(key => {
                    if (question.userChoice === question.answer) {
                        gameState.factionScores[key] += question.factionPoints[key];
                    }
                });

                renderFactionScores();
                updateMemoryCapacity();
                renderEvidenceGrid();
                renderKeyQuestions();
                checkUnlockNewQuestions();

                // 验证成功后重置拖拽区域
                setTimeout(() => {
                    dropZone.classList.remove('correct');
                }, 300);
            } else {
                dropZone.classList.add('incorrect');
                // 不覆盖拖拽区域内容
                
                resultMsg.className = 'result-message failure';
                resultMsg.textContent = '尽管我做出了这种判断，但似乎没有相关信息可以佐证。请尝试其他证据。';
            }
        }

        function checkUnlockNewQuestions() {
            const truth = gameState.currentTruth;
            if (!truth) return;

            // 检查是否有问题需要解锁
            truth.keyQuestions.forEach(q => {
                if (!q.unlocked && q.requirement) {
                    if (q.requirement.fromTruth && gameState.revealedTruths.includes(q.requirement.fromTruth)) {
                        q.unlocked = true;
                    }
                }
            });
        }

        // ==================== 临时记忆 ====================
        function addToMemory(question) {
            if (gameState.memorySlots.length >= gameState.maxMemorySlots) {
                alert('记忆空间已满！需要提升阵营分数来解锁更多空间。');
                return;
            }

            gameState.memorySlots.push({
                text: question.text,
                questionId: question.id
            });

            renderMemorySlots();
            updateMemoryCapacity();
        }

        function removeFromMemory(index) {
            gameState.memorySlots.splice(index, 1);
            renderMemorySlots();
            updateMemoryCapacity();
        }

        // ==================== 结局系统 ====================
        function checkEndingRequirement(ending) {
            return Object.keys(ending.requirement).every(key => 
                gameState.factionScores[key] >= ending.requirement[key]
            );
        }

        function formatRequirements(req) {
            const names = { order: '秩序', innovation: '创新', question: '质疑', economy: '经济' };
            if (req.factionReq) {
                return Object.entries(req.factionReq).map(([k, v]) => `${names[k]}>${v}`).join(', ');
            }
            return Object.entries(req).map(([k, v]) => `${names[k]}>${v}`).join(', ');
        }

        function renderEndings() {
            const container = document.getElementById('endingOptions');
            const truth = gameState.currentTruth;
            if (!truth) return;

            container.innerHTML = truth.endings.map(ending => {
                const isSelected = gameState.selectedEnding === ending.id;
                return `
                    <div class="ending-option ${ending.recommended ? 'recommended' : ''} ${isSelected ? 'selected' : ''}"
                         onclick="selectEnding('${ending.id}')"
                         title="点击预览/选择此结局（Debug功能）">
                        <div class="ending-option-title">${ending.title} ${ending.recommended ? '★' : ''} ${isSelected ? '✓' : ''}</div>
                        <div class="ending-option-desc">${ending.description}</div>
                        <div class="ending-req">所需: ${formatRequirements(ending.requirement)}</div>
                    </div>
                `;
            }).join('');
        }

        function selectEnding(endingId) {
            const truth = gameState.currentTruth;
            if (!truth) return;
            
            const ending = truth.endings.find(e => e.id === endingId);
            if (!ending) return;

            // 直接公开此真相
            gameState.selectedEnding = endingId;
            
            // 添加结局加成
            Object.keys(ending.bonus).forEach(key => {
                gameState.factionScores[key] += ending.bonus[key];
            });

            // 标记真相为已公开
            gameState.revealedTruths.push(truth.id);
            truth.completed = true;

            // 显示结局弹窗
            showEndingModal(ending);

            // 更新UI
            renderFactionScores();
            renderTruthCards();
            renderEndings();
            unlockNextChapter();
            document.getElementById('investigationStatus').textContent = '已公开';
            document.getElementById('investigationStatus').classList.add('revealed');
            document.getElementById('revealTruthBtn').disabled = true;
            
            // 关闭真相调查面板
            setTimeout(() => {
                closeInvestigation();
            }, 500);
        }

        function revealTruth() {
            const truth = gameState.currentTruth;
            if (!truth) return;

            // 检查是否所有关键问题都已选择
            const allAnswered = truth.keyQuestions.every(q => q.userChoice !== null);
            if (!allAnswered) {
                alert('请先回答所有关键问题！');
                return;
            }

            // 计算关键问题答对后的阵营分数（只在真相公开时添加）
            truth.keyQuestions.forEach(q => {
                if (q.userChoice === q.answer) {
                    Object.keys(q.factionPoints).forEach(key => {
                        gameState.factionScores[key] += q.factionPoints[key];
                    });
                }
            });

            // 找出最适合的结局（debug模式优先使用手动选择的结局）
            let bestEnding;
            if (gameState.selectedEnding) {
                // 使用debug手动选择的结局
                bestEnding = truth.endings.find(e => e.id === gameState.selectedEnding);
                if (!bestEnding) {
                    bestEnding = truth.endings[0];
                }
            } else {
                // 自动匹配结局
                bestEnding = truth.endings.find(e => e.recommended) || truth.endings[0];
                let maxScore = -1;
                truth.endings.forEach(ending => {
                    const score = Object.keys(ending.requirement).reduce((sum, key) => {
                        return sum + Math.max(0, gameState.factionScores[key] - ending.requirement[key]);
                    }, 0);
                    if (score > maxScore) {
                        maxScore = score;
                        bestEnding = ending;
                    }
                });
            }

            // 添加结局加成
            Object.keys(bestEnding.bonus).forEach(key => {
                gameState.factionScores[key] += bestEnding.bonus[key];
            });

            // 标记真相为已公开
            gameState.revealedTruths.push(truth.id);
            truth.completed = true;

            // 显示结局弹窗
            showEndingModal(bestEnding);

            // 更新UI
            renderFactionScores();
            document.getElementById('investigationStatus').textContent = '已公开';
            document.getElementById('investigationStatus').classList.add('revealed');
            document.getElementById('revealTruthBtn').disabled = true;

            // 解锁新章节
            unlockNextChapter();
        }

        function showEndingModal(ending) {
            const modal = document.getElementById('endingModal');
            document.getElementById('endingTitle').textContent = ending.title;
            document.getElementById('endingDesc').textContent = ending.description;
            
            const bonusContainer = document.getElementById('endingBonus');
            bonusContainer.innerHTML = Object.keys(ending.bonus).map(key => {
                const names = { order: '秩序', innovation: '创新', question: '质疑', economy: '经济' };
                return `<div class="bonus-item">${names[key]} <span>+${ending.bonus[key]}</span></div>`;
            }).join('');

            modal.classList.add('active');
        }

        function closeEndingModal() {
            document.getElementById('endingModal').classList.remove('active');
            closeInvestigation();
        }

        function unlockNextChapter() {
            // 根据完成的真相数量解锁下一章节
            const revealedCount = gameState.revealedTruths.length;
            
            gameData.chapters.forEach((chapter, index) => {
                if (index > 0 && revealedCount >= index * 2) {
                    chapter.locked = false;
                }
            });

            renderChapterTabs();
        }

        // ==================== 启动 ====================
        document.addEventListener('DOMContentLoaded', () => {
            init();
            setupDropZone();
        });
    </script>
</body>
</html>
